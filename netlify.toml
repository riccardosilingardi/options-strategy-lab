[build]
  command = "npm run build"
  publish = "dist"

# EDGE FUNCTIONS, DECLARED HERE AND IN THIS ORDER, ON PURPOSE.
#
# They run in the order they are written below. `gate` is the password and it
# has to be first: `ai` proxies the Anthropic key, and an unauthenticated proxy
# on the open internet is the one mistake in this repository that would matter
# to somebody other than its owner. In-source `export const config` makes no
# promise about the order BETWEEN files, so neither file uses it — one
# mechanism, one written order, nothing to reason about.
#
# `ai` is an edge function rather than a Netlify Function because a synchronous
# function is killed at roughly ten seconds and a 1200-token streamed analysis
# takes longer than that every time. There is no /api/ai redirect any more: the
# edge function claims the path itself.
# THE MANIFEST AND THE ICONS ARE OUTSIDE THE GATE, AND THEY HAVE TO BE.
#
# The browser fetches a web app manifest WITHOUT CREDENTIALS. It is not the page
# asking; it is the install machinery, and it does not send the Basic-Auth
# header the user typed into the popup. Behind the gate it gets a 401, the
# manifest never parses, and the browser simply does not offer "Install app" —
# with no error anywhere, on any screen. The same is true of the icons the
# manifest names: they are fetched by the same credential-less path, so an icon
# behind the gate is a home-screen tile that never appears.
#
# What leaves the gate is therefore exactly four PNGs and one JSON file naming
# them. No data, no account, no key — the app's own name and its picture. The
# app itself, every /api/* path and the service worker all stay behind the
# password, which is where the actual secrets and the actual money are.
[[edge_functions]]
  function = "gate"
  path = "/*"
  excludedPath = [
    "/api/approve",
    "/manifest.webmanifest",
    "/icon-192.png",
    "/icon-512.png",
    "/icon-512-maskable.png",
    "/apple-touch-icon-180.png",
  ]

[[edge_functions]]
  function = "ai"
  path = "/api/ai"

[[redirects]]
  from = "/api/chain"
  to = "/.netlify/functions/chain"
  status = 200

[[redirects]]
  from = "/api/chainAlpaca"
  to = "/.netlify/functions/chainAlpaca"
  status = 200

[[redirects]]
  from = "/api/av"
  to = "/.netlify/functions/av"
  status = 200

[[redirects]]
  from = "/api/bars"
  to = "/.netlify/functions/bars"
  status = 200

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/api/approve"
  to = "/.netlify/functions/approve"
  status = 200

[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/api/liquidity"
  to = "/.netlify/functions/liquidity"
  status = 200

[[redirects]]
  from = "/api/alpaca"
  to = "/.netlify/functions/alpaca"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

