<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find — nothing fits</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-dark{--bg:#14181d;--panel:#1a1f26;--line:#2a2f36;--field:#6b7685;--ink:#f5f0e6;--mut:#8b95a1;--dim:#7d8794;--amber:#e8b545;--green:#7fb85c;--red:#d66a5a;--blue:#5aa7d6;--body:#c9d1d9;--on:#14181d;--action:#5aa7d6;--raise:#222831}
.t-light{--bg:#f5f6f7;--panel:#ffffff;--line:#dcdfe3;--field:#7a8491;--ink:#1c2128;--mut:#5a6472;--dim:#616b78;--amber:#8a6300;--green:#2f6f45;--red:#b23a2b;--blue:#1f6391;--body:#2a3038;--on:#ffffff;--action:#1f6391;--raise:#eceff2}
.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}a:hover{color:var(--ink)}
.tab{border:none;border-bottom:3px solid transparent;color:var(--mut);font-weight:400}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--amber)}
.chip{border:1px solid var(--field);background:transparent;color:var(--mut);border-radius:999px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.slider{accent-color:var(--amber)}
</style>
</helmet>
<div class="{{ themeClass }} sans" style="width: 390px; height: 640px; box-sizing: border-box; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 8px 0 16px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3">Find</h1>
<span style="width: 44px; height: 44px"></span>
</header>
<p style="margin: 0; padding: 0 16px 6px; font-size: 12px; line-height: 1.3; color: var(--mut); display: flex; align-items: center; gap: 6px">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; flex: none"></span>
<span>Close · Fri 2 Oct, 16:00 ET · indicative feed</span>
</p>
<nav aria-label="Categories" style="display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line)">
<button type="button" class="tab on" aria-pressed="true" style="min-height: 44px; padding: 0 10px; background: transparent; font-size: 15px">All <span class="mono" style="font-size: 12px; color: var(--dim); font-weight: 400">10</span></button>
<button type="button" class="tab" style="min-height: 44px; padding: 0 10px; background: transparent; font-size: 15px">Grains <span class="mono" style="font-size: 12px; color: var(--dim)">3</span></button>
<button type="button" class="tab" style="min-height: 44px; padding: 0 10px; background: transparent; font-size: 15px">Energy <span class="mono" style="font-size: 12px; color: var(--dim)">4</span></button>
<button type="button" class="tab" style="min-height: 44px; padding: 0 10px; background: transparent; font-size: 15px">Metals <span class="mono" style="font-size: 12px; color: var(--dim)">3</span></button>
</nav>
<section style="padding: 10px 16px 0">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<label for="budget-e" style="font-size: 13px; color: var(--mut)">Budget per trade</label>
<span style="display: flex; align-items: baseline; gap: 6px"><span class="mono" style="font-size: 15px; font-weight: 700">$50</span><span style="font-size: 12px; color: var(--dim)">0.5% of $10,000</span></span>
</div>
<input id="budget-e" class="slider" type="range" min="50" max="1000" step="25" value="50" readonly style="width: 100%; height: 32px; margin: 2px 0 0; display: block">
</section>
<div role="group" aria-label="List filters" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 16px 8px">
<button type="button" class="chip on" aria-pressed="true" style="min-height: 36px; padding: 0 12px; font-size: 12px">Only a positive future avg</button>
<button type="button" class="chip on" aria-pressed="true" style="min-height: 36px; padding: 0 12px; font-size: 12px">Hide cards that miss · 10</button>
</div>
<div style="border-top: 1px solid var(--line); padding: 28px 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--dim)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4.3-4.3"></path><path d="M8 11h6"></path></svg>
<p style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3">Nothing fits a $50 budget.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--body)">All 10 markets miss. Cheapest here: CORN bull put spread, <span class="mono">$75</span> risk.</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="min-height: 44px; padding: 0 16px; border: none; border-radius: 10px; background: var(--amber); color: var(--on); font-size: 13px; font-weight: 700">Set budget to $75</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid var(--field); border-radius: 10px; background: transparent; color: var(--ink); font-size: 13px; font-weight: 700">Show the 10 that miss</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    return { themeClass: dark ? "t-dark" : "t-light" };
  }
}
</script>
</body>
</html>
