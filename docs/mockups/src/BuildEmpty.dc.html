<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build — empty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-dark{--bg:#14181d;--panel:#1a1f26;--line:#2a2f36;--field:#6b7685;--ink:#f5f0e6;--mut:#8b95a1;--dim:#7d8794;--amber:#e8b545;--green:#7fb85c;--red:#d66a5a;--blue:#5aa7d6;--body:#c9d1d9;--on:#14181d;--action:#5aa7d6;--raise:#222831}
.t-light{--bg:#f5f6f7;--panel:#ffffff;--line:#dcdfe3;--field:#7a8491;--ink:#1c2128;--mut:#5a6472;--dim:#616b78;--amber:#8a6300;--green:#2f6f45;--red:#b23a2b;--blue:#1f6391;--body:#2a3038;--on:#ffffff;--action:#1f6391;--raise:#eceff2}
.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:var(--blue)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="{{ themeClass }} sans" style="width: 390px; height: 640px; box-sizing: border-box; background: var(--bg); color: var(--ink); overflow: hidden">
<header style="padding: 12px 16px 4px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3">Build</h1>
</header>
<main style="display: flex; flex-direction: column; gap: 14px; padding: 48px 16px 0; align-items: flex-start">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--dim)"><path d="M13 3l8 8-3 3-8-8z"></path><path d="M11.5 7.5l-8 8a1.6 1.6 0 0 0 2.3 2.3l8-8"></path></svg>
<p style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3">Nothing on Build yet.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--body)">Pick a card in Find, or tap prices in a market's chain. The trade you pick lands here with its numbers, its chart and its exit plan.</p>
<div style="display: flex; gap: 8px; width: 100%">
<a href="Main.dc.html" style="flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--amber); color: var(--on); text-decoration: none; font-size: 13px; font-weight: 700">Go to Find</a>
<a href="Market.dc.html" style="flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--field); color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 700">Open a chain</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() { var dark = this.props.dark ?? true; return { themeClass: dark ? "t-dark" : "t-light" }; }
}
</script>
</body>
</html>
