<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build — loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-dark{--bg:#14181d;--panel:#1a1f26;--line:#2a2f36;--field:#6b7685;--ink:#f5f0e6;--mut:#8b95a1;--dim:#7d8794;--amber:#e8b545;--green:#7fb85c;--red:#d66a5a;--blue:#5aa7d6;--body:#c9d1d9;--on:#14181d;--action:#5aa7d6;--raise:#222831}
.t-light{--bg:#f5f6f7;--panel:#ffffff;--line:#dcdfe3;--field:#7a8491;--ink:#1c2128;--mut:#5a6472;--dim:#616b78;--amber:#8a6300;--green:#2f6f45;--red:#b23a2b;--blue:#1f6391;--body:#2a3038;--on:#ffffff;--action:#1f6391;--raise:#eceff2}
.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:var(--blue)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="{{ themeClass }} sans" style="width: 390px; height: 640px; box-sizing: border-box; background: var(--bg); color: var(--ink); overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 0 4px">
<a href="MarketStrategies.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 10px 0 4px; color: var(--ink); text-decoration: none; font-size: 15px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span>CORN</span></a>
<span style="font-size: 12px; font-weight: 700; padding: 2px 8px; border: 1px solid var(--field); border-radius: 999px; color: var(--mut)">Paper</span>
</header>
<main aria-busy="true" style="display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 0">
<div>
<h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3">Bull put spread</h1>
<p class="mono" style="margin: 2px 0 0; font-size: 13px; color: var(--mut)">CORN · 20 Nov · 47 days</p>
</div>
<section role="status" style="background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 15px; line-height: 1.5">Reading CORN's chain for 20 Nov…</p>
<span aria-hidden="true" style="height: 3px; border-radius: 2px; background: var(--line); display: block; position: relative; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 45%; background: var(--amber)"></span></span>
<div aria-hidden="true" style="height: 220px; border: 1px dashed var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--dim)">The chart waits for a bid and an ask on both legs.</div>
</section>
<section style="background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px">
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px">
<div><dt style="font-size: 12px; color: var(--mut)">Max profit</dt><dd class="mono" style="margin: 2px 0 0; font-size: 18px; font-weight: 700; color: var(--dim)">—</dd></div>
<div><dt style="font-size: 12px; color: var(--mut)">Max loss</dt><dd class="mono" style="margin: 2px 0 0; font-size: 18px; font-weight: 700; color: var(--dim)">—</dd></div>
<div><dt style="font-size: 12px; color: var(--mut)">Breakeven</dt><dd class="mono" style="margin: 2px 0 0; font-size: 18px; font-weight: 700; color: var(--dim)">—</dd></div>
<div><dt style="font-size: 12px; color: var(--mut)">Chance</dt><dd class="mono" style="margin: 2px 0 0; font-size: 18px; font-weight: 700; color: var(--dim)">—</dd></div>
</dl>
<p style="margin: 10px 0 0; font-size: 12px; color: var(--dim)">A dash is a number not read yet, never a zero.</p>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() { var dark = this.props.dark ?? true; return { themeClass: dark ? "t-dark" : "t-light" }; }
}
</script>
</body>
</html>
